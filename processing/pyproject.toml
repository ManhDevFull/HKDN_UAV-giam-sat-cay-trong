[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkdn-processing"
version = "0.1.0"
description = "Survey3 RAW preprocessing experiments for HKDN"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
dev = ["pytest>=8"]

[project.scripts]
hkdn-process = "hkdn_processing.cli:main"
hkdn-make-sample = "hkdn_processing.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
