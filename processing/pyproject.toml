[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-processing"
version = "0.3.0"
description = "Survey3 RAW/JPEG relative radiometric correction and raster handoff"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "tifffile>=2023.7.10"]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]

[project.scripts]
process-survey = "processing.cli:main"
make-synthetic-survey = "processing.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
processing = ["profiles/*.json", "profiles/*LICENSE.txt"]
